<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dce8df">
  <meta name="description" content="连续前进的三维插 U 盘游戏。左右移动，翻转，对准落下的电脑插口。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='17' y='27' width='30' height='32' rx='7' fill='%23f5f0e7'/%3E%3Cpath d='M22 27V7h20v20' fill='%235a7067'/%3E%3Cpath d='M27 12v6m10-6v6' stroke='%23efeadb' stroke-width='4'/%3E%3C/svg%3E">
  <title>插个 U 盘</title>
  <style>@font-face{font-family:Desk;src:local('Avenir Next'),local('Aptos'),local('Segoe UI')}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8df}
body{font-family:Desk,'Microsoft YaHei','PingFang SC',sans-serif;color:#30463b;-webkit-tap-highlight-color:transparent}
button{font:inherit;border:0;color:inherit;cursor:pointer;touch-action:manipulation;transition:background .16s,transform .16s}
button:active:not(:disabled){transform:scale(.94)}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #bd785c;outline-offset:5px}[hidden]{display:none!important}
#app,#scene{position:absolute;inset:0;width:100%;height:100%}#scene{touch-action:none;user-select:none}#scene canvas{display:block;width:100%;height:100%}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#dce8df33,transparent 20%,transparent 78%,#dce8df55)}
#score{position:absolute;left:44px;top:30px;font-size:50px;line-height:1;font-weight:400;letter-spacing:-.055em;font-variant-numeric:tabular-nums;pointer-events:none;color:#3f5b46}
.tools{position:absolute;right:36px;top:29px;display:flex;gap:9px}.icon-btn{width:42px;height:42px;display:grid;place-items:center;border:1px solid #71876c22;background:#f5f6e77a;border-radius:50%;backdrop-filter:blur(10px)}.icon-btn:hover{background:#f5f6e7}.icon-btn svg{width:19px;height:19px}
svg path{stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}button svg{pointer-events:none}
.control-dock{position:absolute;left:50%;bottom:max(30px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:17px}
.move-btn{width:53px;height:53px;display:grid;place-items:center;background:#f5f5e7bd;border:1px solid #f7f7e7cc;border-radius:50%;color:#6b8167;backdrop-filter:blur(10px)}.move-btn svg{width:23px;height:23px}.move-btn:hover{background:#fffdeb}
.flip-btn{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:#d87157;border:4px solid #f0efdd;color:#fff7e7;box-shadow:0 0 0 1px #ad775633,0 6px 17px #875b3b22}.flip-btn svg{width:31px;height:31px}.flip-btn:hover{background:#c96950}.flip-btn.spinning svg{animation:half-turn .34s ease-in-out}
.modal-backdrop{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#304e3c27;backdrop-filter:blur(6px);padding:20px}
.modal{width:300px;max-width:100%;padding:34px 30px 28px;background:#f5f5e9ed;border:1px solid #ffffff99;border-radius:26px;box-shadow:0 20px 70px #27432b20;text-align:center;animation:appear .22s ease}
.modal h1{font-size:27px;font-weight:600;letter-spacing:.02em;margin:2px 0 25px}.primary-btn,.secondary-btn{display:block;width:100%;padding:14px;border-radius:30px;font-size:14px}.primary-btn{background:#d87157;color:#fff8ea}.primary-btn:hover{background:#c96950}.secondary-btn{background:transparent;color:#809075;margin-top:8px}
#result-score{display:block;margin:-8px 0 24px;font-size:52px;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:#78916e}
.loading{position:absolute;inset:0;background:#dce8df;z-index:30;display:grid;place-items:center;transition:opacity .35s}.loading-plug{height:52px;width:30px;background:#f7f5e9;border-radius:5px;position:relative;animation:bob 1s ease-in-out infinite}.loading-plug:before{content:'';position:absolute;top:-15px;left:6px;right:6px;height:17px;border:3px solid #879b85;border-bottom:0;background:linear-gradient(90deg,transparent 35%,#526f5a 35%,#526f5a 65%,transparent 65%)}
@keyframes half-turn{to{transform:rotate(180deg)}}@keyframes appear{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}@keyframes bob{50%{transform:translateY(-6px)}}
@media(max-width:760px){#score{left:24px;top:max(25px,env(safe-area-inset-top));font-size:38px}.tools{right:22px;top:max(23px,env(safe-area-inset-top));gap:8px}.icon-btn{width:36px;height:36px}.icon-btn svg{width:17px;height:17px}.control-dock{bottom:max(22px,env(safe-area-inset-bottom));gap:16px}.move-btn{width:48px;height:48px}.flip-btn{width:72px;height:72px}.modal{width:286px;padding:30px 26px 24px}}
@media(prefers-reduced-motion:reduce){button{transition:none}.modal{animation:none}.loading-plug{animation:none}}
#score-form{text-align:left}#score-form label{font-size:13px;display:block;margin-bottom:8px;color:#647961}#nickname{width:100%;min-width:0;font:inherit;font-size:14px;color:#30463b;background:#ffffff80;border:1px solid #71876c35;border-radius:12px;padding:13px 12px;margin-bottom:12px;outline-offset:3px}#nickname:focus{outline:2px solid #bd785c}#nickname:disabled{opacity:.65}#restart-btn{background:#e1e7d6;color:#425b40}.form-status{font-size:12px;line-height:1.6;min-height:20px;margin:10px 0 14px;color:#6e7f64}#result-modal{width:330px;max-height:calc(100dvh - 30px);overflow:auto}#result-modal h1{margin-bottom:14px}#result-score{margin-bottom:18px}#result-board-btn{margin-top:3px}
.leaderboard-modal{width:510px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding:25px 28px;min-height:350px}.board-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.board-heading h1{font-size:24px;margin:0}.board-heading .icon-btn{flex-shrink:0;width:34px;height:34px;background:transparent}.board-tabs{display:flex;background:#dfe6d8;border-radius:14px;padding:4px;margin:23px 0 10px;gap:4px}.board-tabs button{flex:1;padding:10px 4px;background:transparent;border-radius:11px;font-size:14px;color:#75856a}.board-tabs [aria-selected=true]{background:#f9f8ee;color:#3e563d;box-shadow:0 2px 6px #3e563d0c}.board-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#7a886e;padding:2px 2px 10px}.board-meta button{background:transparent;color:#647a58;padding:7px}.board-scroll{overflow:auto;overscroll-behavior:contain;max-height:50dvh;min-height:130px;margin-bottom:20px;scrollbar-width:thin;scrollbar-color:#c0cdb7 transparent}.board-scroll table{width:100%;border-collapse:collapse;text-align:left;table-layout:fixed}.board-scroll th{font-size:11px;font-weight:400;color:#8b967c;padding:10px 6px;border-bottom:1px solid #71876c20}.board-scroll th:first-child{width:54px}.board-scroll th:last-child{width:82px;text-align:right}.board-scroll td{padding:13px 6px;border-bottom:1px solid #71876c13;font-size:14px}.board-scroll td:first-child{font-variant-numeric:tabular-nums;color:#869379}.board-scroll td:last-child{text-align:right;font-size:23px;font-variant-numeric:tabular-nums;color:#536f49}.board-scroll td:nth-child(2) span{display:block;overflow-wrap:anywhere}.board-scroll time{display:block;font-size:10px;color:#8e9a80;margin-top:4px}.board-scroll td.podium{color:#c77856;font-weight:600}.my-score{background:#e4eadb}#board-status{font-size:13px;color:#809075;margin:28px 0;line-height:1.7}#board-status:empty{display:none}#challenge-btn{flex-shrink:0}
@media(max-width:480px){.leaderboard-modal{padding:22px 20px;width:100%;max-height:calc(100dvh - 32px)}.board-heading h1{font-size:22px}.board-scroll{max-height:45dvh}.board-tabs{margin-top:18px}}@media(max-height:500px){.modal-backdrop{padding:12px}.leaderboard-modal{max-height:calc(100dvh - 24px);padding:14px 20px}.board-heading h1{font-size:20px}.board-tabs{margin:10px 0 3px}.board-tabs button{padding:7px}.board-meta{padding-bottom:3px}.board-scroll{min-height:50px;max-height:35dvh;margin-bottom:10px}.leaderboard-modal .primary-btn{padding:10px}.board-scroll td{padding:9px 6px}}

@media(max-height:480px){#score{top:20px;font-size:36px}.tools{top:18px}.control-dock{bottom:15px;gap:13px}.move-btn{width:42px;height:42px}.flip-btn{width:60px;height:60px}.flip-btn svg{width:27px;height:27px}.modal{padding:24px}.modal h1{margin-bottom:17px;font-size:24px}#result-score{font-size:38px;margin-bottom:18px}}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#game-layout{width:100%;height:100%;position:relative}#rank-host,#tutorial-host{display:none}
#nickname-modal{width:320px}#nickname-modal h1{margin-bottom:22px}#nickname-status:empty{display:none}#nickname{margin-bottom:12px}#result-player-name{margin:-8px 0 6px;color:#78916e;font-size:14px}#retry-score-btn{margin:-10px 0 8px}#submit-status{min-height:20px}
.tutorial-modal{width:320px;padding:26px 24px;max-height:calc(100dvh - 32px);overflow:auto}.tutorial-modal .board-heading h1{font-size:22px}.demo-stage{position:relative;margin:18px -2px 0;border-radius:20px;background:#e1e9d999}.demo-stage>svg{width:100%;height:244px;display:block}.demo-location{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;color:#849477;letter-spacing:.08em}.demo-faces{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;text-align:center;margin:16px 0 6px;color:#849477;font-size:10px}.demo-faces svg{width:100%;height:auto;grid-column:1/-1;margin-top:6px}.demo-steps{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:6px}.demo-steps li{display:flex;align-items:center;gap:9px;padding:10px 8px;border-radius:11px;color:#8b987e;font-size:11px;transition:background .3s,color .3s}.demo-steps b{font-weight:400;font-variant-numeric:tabular-nums;font-size:10px}.demo-steps li[aria-current]{background:#e7e8d6;color:#b87452}.demo-steps kbd{margin-left:auto;font:inherit;font-size:10px;white-space:nowrap;padding:3px 5px;border:1px solid #9aab8a33;border-radius:5px;background:#fffbee55;color:#6d825e}.demo-tick{margin-left:auto;padding-right:7px;color:#7d996b}#replay-demo-btn{font-size:11px;padding:10px;margin-top:12px}#replay-demo-btn span{margin-left:7px;font-size:16px}
@media(min-width:1180px){
  #game-layout{display:grid;grid-template-columns:268px minmax(0,1fr)248px;gap:20px;padding:24px;background:radial-gradient(ellipse at 50% 30%,#e5ebdf,#dce5d8)}
  #app{position:relative;inset:auto;min-width:0;height:100%;overflow:hidden;border-radius:28px;border:1px solid #f4f6e78c;box-shadow:0 18px 55px #3652380b}
  #rank-host,#tutorial-host{display:flex;align-items:center;min-width:0;min-height:0}
  .modal.docked{display:flex;flex-direction:column;width:100%;max-width:100%;max-height:calc(100dvh - 72px);margin:0;border-radius:24px;box-shadow:0 12px 35px #36523808;animation:none;background:#f5f5e9c4;border-color:#f9f9ee9e}
  .leaderboard-modal.docked{padding:24px 18px;height:min(650px,calc(100dvh - 96px));min-height:250px}
  .docked .board-heading h1{font-size:21px}.docked .board-heading .icon-btn{display:none}.docked .board-tabs{margin:20px 0 6px}.docked .board-tabs button{font-size:12px;padding:10px 2px}.docked .board-meta{font-size:10px;padding-bottom:8px}.docked .board-scroll{max-height:none;min-height:80px;flex:1;margin-bottom:16px}.docked .board-scroll th:first-child{width:35px}.docked .board-scroll th:last-child{width:60px}.docked .board-scroll th{font-size:10px;padding:10px 3px}.docked .board-scroll td{padding:12px 3px;font-size:12px}.docked .board-scroll td:last-child{font-size:21px}.docked .board-scroll time{font-size:9px}.docked #board-status{font-size:12px}.docked #challenge-btn{font-size:12px;padding:12px}.tutorial-modal.docked{padding:24px 18px}.docked .demo-stage>svg{height:228px}.docked .demo-steps li{font-size:10px;gap:7px;padding:10px 6px}
  #leaderboard-btn,#tutorial-btn{display:none}#score{left:28px;top:28px;font-size:42px}.tools{right:24px;top:24px;gap:8px}.icon-btn{width:36px;height:36px}.control-dock{bottom:24px}.docked:focus-within{border-color:#a8b996}
}
@media(min-width:1600px){#game-layout{grid-template-columns:290px minmax(0,1fr)270px;gap:26px;padding:28px}.leaderboard-modal.docked{padding:26px 22px}.tutorial-modal.docked{padding:26px 22px}.docked .demo-stage>svg{height:246px}.docked .demo-steps li{font-size:11px}}
@media(max-height:500px) and (max-width:1179px){.tutorial-modal{padding:18px 22px}.demo-stage>svg{height:165px}.demo-steps{margin-top:10px;gap:2px}.demo-steps li{padding:7px}.demo-faces{margin-top:10px}.demo-stage{margin-top:12px}}
</style>
</head>
<body>
  <div id="game-layout">
  <aside id="rank-host" aria-label="全国排行榜"></aside>
  <main id="app">
    <div id="scene" role="img" aria-label="U盘持续前进，电脑从上方落到桌面的三维游戏"></div>
    <div class="vignette" aria-hidden="true"></div>
    <output id="score" aria-label="已通过0台电脑">00</output>
    <nav class="tools" aria-label="游戏操作">
      <button id="leaderboard-btn" class="icon-btn" aria-label="排行榜"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 4h8v6a4 4 0 0 1-8 0V4Zm0 2H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 1v6m-4 0h8"/></svg></button>
      <button id="tutorial-btn" class="icon-btn" aria-label="查看插入演示"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 7 7 5-7 5V7Z"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg></button>
      <button id="sound-btn" class="icon-btn" aria-label="关闭音效" aria-pressed="true"></button>
      <button id="pause-btn" class="icon-btn" aria-label="暂停游戏"></button>
    </nav>
    <div class="control-dock" aria-label="移动与翻转">
      <button id="left-btn" class="move-btn" aria-label="向左移动"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m13 6-6 6 6 6m-6-6h13"/></svg></button>
      <button id="flip-btn" class="flip-btn" aria-label="翻转U盘180度"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 7a8 8 0 1 0 1 8M19 3v5h-5"/></svg></button>
      <button id="right-btn" class="move-btn" aria-label="向右移动"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m11 6 6 6-6 6m6-6H4"/></svg></button>
    </div>
    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <section id="nickname-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="nickname-title" hidden>
        <h1 id="nickname-title">你的昵称</h1>
        <form id="nickname-form"><label class="sr-only" for="nickname">你的昵称</label><input id="nickname" name="nickname" maxlength="32" autocomplete="nickname" placeholder="输入昵称" required><p id="nickname-status" class="form-status" role="status"></p><button class="primary-btn" type="submit">开始挑战</button></form>
      </section>
      <section id="pause-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
        <h1 id="pause-title">已暂停</h1>
        <button id="resume-btn" class="primary-btn">继续</button>
        <button id="pause-restart-btn" class="secondary-btn">重新开始</button>
      </section>
      <section id="result-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
        <h1 id="result-title">游戏失败</h1>
        <output id="result-score" aria-label="本局通过数量">00</output>
        <p id="result-player-name"></p>
        <p id="submit-status" class="form-status" role="status" aria-live="polite"></p>
        <button id="retry-score-btn" class="secondary-btn" hidden>重试保存成绩</button>
        <button id="restart-btn" class="primary-btn">再来一次</button>
        <button id="result-board-btn" class="secondary-btn">查看排行榜</button>
      </section>
      <section id="leaderboard-modal" class="modal leaderboard-modal" role="dialog" aria-modal="true" aria-labelledby="board-title" hidden>
        <div class="board-heading"><h1 id="board-title">全国排行榜</h1><button id="close-board-btn" class="icon-btn" aria-label="关闭排行榜"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="board-tabs" role="tablist" aria-label="成绩分类"><button id="best-tab" role="tab" aria-selected="true" aria-controls="board-panel" data-mode="best">最高排名</button><button id="all-tab" role="tab" aria-selected="false" aria-controls="board-panel" data-mode="all">全部成绩</button></div>
        <div class="board-meta"><span id="board-count">正在读取</span><button id="refresh-board-btn">刷新</button></div>
        <div id="board-panel" class="board-scroll" role="tabpanel" aria-labelledby="best-tab" tabindex="0"><table><thead><tr><th scope="col">排名</th><th scope="col">玩家</th><th scope="col">插对数量</th></tr></thead><tbody id="board-rows"></tbody></table><p id="board-status" role="status" aria-live="polite"></p><button id="more-board-btn" class="secondary-btn" hidden>加载更多</button></div>
        <button id="challenge-btn" class="primary-btn">继续挑战</button>
      </section>
      <section id="tutorial-modal" class="modal tutorial-modal" role="dialog" aria-modal="true" aria-labelledby="tutorial-title" hidden>
        <div class="board-heading"><h1 id="tutorial-title">怎么插 U 盘</h1><button id="close-tutorial-btn" class="icon-btn" aria-label="关闭演示"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div class="demo-stage" role="img" aria-label="循环演示：U盘横移对准插口，翻转使上下舌片错开，再向前正确插入">
          <svg id="insertion-demo" viewBox="0 0 240 260" fill="none" aria-hidden="true">
            <defs><linearGradient id="demo-case" x2="1" y2="1"><stop stop-color="#cbd3c5"/><stop offset="1" stop-color="#a6b6a4"/></linearGradient></defs>
            <path d="M50 126v117m70-117v117m70-117v117" stroke="#93a58b" stroke-opacity=".22" stroke-dasharray="3 6"/>
            <g id="demo-computer"><rect x="25" y="26" width="190" height="68" rx="8" fill="#597161"/><rect x="31" y="32" width="178" height="55" rx="4" fill="#2d493b"/><path d="m110 49 22 11-22 11V49Z" fill="#9eb895"/><path d="m25 94-13 24a6 6 0 0 0 5 9h206a6 6 0 0 0 5-9l-13-24H25Z" fill="url(#demo-case)"/><path d="M42 102h156m-163 7h169" stroke="#718c76" stroke-width="4" stroke-dasharray="9 3"/><rect x="98" y="114" width="44" height="7" rx="2" fill="#93a98f"/><g id="demo-port"><rect x="-16" y="122" width="32" height="12" rx="2" fill="#354f41" stroke="#d6dccd" stroke-width="2"/><path d="M-12 130h24" stroke="#c8d0b6" stroke-width="3"/></g></g>
            <g id="demo-plug"><ellipse cx="0" cy="40" rx="16" ry="5" fill="#8c9e80" opacity=".16"/><g id="demo-plug-turn"><rect x="-11" y="-24" width="22" height="30" rx="2" fill="#aab8a4" stroke="#8ca086"/><path d="M-5-17v6m10-6v6" stroke="#567550" stroke-width="4"/><rect x="-15" y="3" width="30" height="45" rx="8" fill="#faf8ea" stroke="#d2d9c7"/><path d="M-7 35H7" stroke="#afbea1" stroke-width="2"/></g></g>
            <g id="demo-check" opacity="0"><circle cx="120" cy="186" r="20" fill="#78966a"/><path d="m111 186 6 6 13-14" stroke="#fffced" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
          </svg>
          <span id="demo-location" class="demo-location">左侧插口</span>
        </div>
        <div class="demo-faces"><span>插口正面</span><span>U 盘正面</span><svg viewBox="0 0 220 48" aria-hidden="true"><g><rect x="4" y="5" width="78" height="34" rx="4" fill="#94a48e"/><rect x="10" y="10" width="66" height="24" rx="1" fill="#2d493b"/><rect id="demo-port-tongue" x="13" y="26" width="60" height="6" fill="#c4ceb4"/></g><path d="M99 22h22m-5-5 5 5-5 5" fill="none" stroke="#8d9e80" stroke-width="1.8"/><g><rect x="138" y="5" width="78" height="34" rx="4" fill="#b7c2ab"/><rect x="144" y="10" width="66" height="24" rx="1" fill="#2d493b"/><rect id="demo-usb-tongue" x="147" y="26" width="60" height="6" fill="#b8c7aa"/></g></svg></div>
        <ol class="demo-steps"><li data-step="0"><b>01</b><span>左右移动，对准插口</span><kbd>← →</kbd></li><li data-step="1"><b>02</b><span>翻转，让舌片错开</span><kbd>空格</kbd></li><li data-step="2"><b>03</b><span>保持对准，向前插入</span><span class="demo-tick">✓</span></li></ol>
        <button id="replay-demo-btn" class="secondary-btn">重播演示 <span aria-hidden="true">↻</span></button>
      </section>
      <section id="connection-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="connection-title" hidden>
        <h1 id="connection-title">暂时连接不上</h1><p id="connection-status" class="form-status" role="status"></p><button id="retry-connection-btn" class="primary-btn">重试</button>
